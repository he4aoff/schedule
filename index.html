<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Timetable - BIS 2026-2027</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #F6F4EF;
  --card: #FFFFFF;
  --ink: #1B1F2A;
  --mut: #5A5F6B;
  --line: #CFC8B6;
  --teal: #0F766E;
  --onteal: #FFFFFF;
  --amber: #B45309;
  --onamber: #FFFFFF;
  --note: #FFF6DD;
  --lec: #D9EFEA;
  --onlec: #0B4F49;
  --sec: #F8E8CF;
  --onsec: #7A3E06;
  --mon: #DCEBFB;
  --tue: #E8E0FA;
  --wed: #D4F1E8;
  --thu: #FCE7D2;
  --sat: #E2E8F0;
  --sun: #FDE2E4;
  --bad: #B42318;
  --bad-bg: #FEE4E2;
  --ok-bg: #D1FADF;
  --ok-ink: #027A48;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161B;
    --card: #1F232B;
    --ink: #EDEEF1;
    --mut: #A4A9B5;
    --line: #3C4252;
    --teal: #14B8A6;
    --onteal: #0B1F1D;
    --amber: #F59E0B;
    --onamber: #1A1203;
    --note: #2E2814;
    --lec: #16403B;
    --onlec: #9FE7DC;
    --sec: #4A3418;
    --onsec: #FBD9A6;
    --mon: #1B2A3D;
    --tue: #29213D;
    --wed: #18332E;
    --thu: #3B2818;
    --sat: #242936;
    --sun: #3A2024;
    --bad: #FDA29B;
    --bad-bg: #4A1B18;
    --ok-bg: #123828;
    --ok-ink: #6CE9A6;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #14161B;
  --card: #1F232B;
  --ink: #EDEEF1;
  --mut: #A4A9B5;
  --line: #3C4252;
  --teal: #14B8A6;
  --onteal: #0B1F1D;
  --amber: #F59E0B;
  --onamber: #1A1203;
  --note: #2E2814;
  --lec: #16403B;
  --onlec: #9FE7DC;
  --sec: #4A3418;
  --onsec: #FBD9A6;
  --mon: #1B2A3D;
  --tue: #29213D;
  --wed: #18332E;
  --thu: #3B2818;
  --sat: #242936;
  --sun: #3A2024;
  --bad: #FDA29B;
  --bad-bg: #4A1B18;
  --ok-bg: #123828;
  --ok-ink: #6CE9A6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  line-height: 1.5;
  transition: background-color 0.2s, color 0.2s;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 10px 20px;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
}

.clock-pill {
  font-size: 13px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 999px;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.sync-pill {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--bg);
  border: 1px solid var(--line);
}

.w {
  max-width: 1020px;
  margin: 0 auto;
  padding: 24px 16px 56px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
h2 { margin: 0 0 6px 4px; font-size: 21px; font-weight: 700; }
h3 { margin: 0; font-size: 18px; font-weight: 700; }
p { margin: 4px 0 0; color: var(--mut); }

.stats { display: flex; flex-wrap: wrap; gap: 12px; }
.st {
  flex: 1 1 180px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 18px;
}
.st b { display: block; font-size: 26px; font-weight: 700; }
.st span { font-size: 13px; color: var(--mut); }

.special-tools {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px;
}
.tool-card {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: border-color 0.15s, background-color 0.15s, transform 0.1s;
}
.tool-card:hover { border-color: var(--teal); }
.tool-card.active {
  border-color: var(--teal);
  background: var(--lec);
}
.tool-icon {
  font-size: 26px;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.tool-info b { display: block; font-size: 15px; color: var(--ink); }
.tool-info small { display: block; font-size: 12px; color: var(--mut); }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

button {
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  min-height: 42px;
  padding: 0 16px;
  border-radius: 10px;
  border: 2px solid var(--teal);
  background: var(--card);
  color: var(--teal);
  cursor: pointer;
  transition: transform 0.1s, opacity 0.15s, background-color 0.15s;
}
button:hover:not(:disabled) { opacity: 0.9; }
button:active:not(:disabled) { transform: scale(0.98); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.on { background: var(--teal); color: var(--onteal); }
button.pill { border-radius: 999px; }
button.gh2 { border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
button.danger { border-color: var(--bad); color: var(--bad); }

.day {
  border-radius: 20px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  background: var(--card);
  border: 1px solid rgba(0, 0, 0, 0.05);
  border-radius: 14px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
}

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.time { width: 140px; font-weight: 700; font-size: 15px; }
.main { flex: 1 1 220px; }
.main b { font-size: 17px; display: block; }
.main small, .meta { color: var(--mut); font-size: 13px; }

.chip {
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  background: var(--lec);
  color: var(--onlec);
}
.chip.s { background: var(--sec); color: var(--onsec); }

.badge {
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--amber);
  color: var(--onamber);
  font-size: 12px;
  font-weight: 700;
}

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

input, textarea, select {
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  min-height: 42px;
}
input:focus, textarea:focus, select:focus {
  outline: 2px solid var(--teal);
  outline-offset: -1px;
}
textarea {
  width: 100%;
  background: var(--note);
  min-height: 64px;
  resize: vertical;
}

.ti { width: 100%; max-width: 155px; padding: 8px 10px; min-height: 38px; }
.as { display: flex; flex-direction: column; gap: 6px; }
.ai {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  padding: 6px 10px;
  border-radius: 10px;
  border: 1px dashed var(--line);
}
.ai label { flex: 1 1 180px; display: flex; gap: 8px; align-items: center; cursor: pointer; }
.ai input[type=checkbox] { width: 20px; height: 20px; min-height: 0; padding: 0; accent-color: var(--teal); }
.done .t { text-decoration: line-through; color: var(--mut); }
.od { color: var(--bad); font-weight: 600; font-size: 13px; }
.pct { font-size: 13px; color: var(--mut); }
.x { min-height: 34px; padding: 0 10px; border-width: 1px; font-weight: 500; font-size: 13px; }
[hidden] { display: none !important; }

.gate {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.gc {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 32px 28px;
  max-width: 440px;
  width: 100%;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink); }
.field input { width: 100%; }

.err-box {
  background: var(--bad-bg);
  color: var(--bad);
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
}
.ok-box {
  background: var(--ok-bg);
  color: var(--ok-ink);
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
}

.auth-tabs {
  display: flex;
  background: var(--bg);
  padding: 4px;
  border-radius: 12px;
  border: 1px solid var(--line);
}
.auth-tabs button {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--mut);
  min-height: 38px;
  border-radius: 9px;
}
.auth-tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

.week-bar {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px 18px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.week-select-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.week-select {
  font-weight: 700;
  color: var(--teal);
  border: 2px solid var(--teal);
  border-radius: 10px;
  padding: 6px 12px;
  min-height: 40px;
  cursor: pointer;
}
.mode-tag {
  padding: 5px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
}
.mode-campus { background: var(--lec); color: var(--onlec); }
.mode-online { background: var(--sec); color: var(--onsec); }

.wk-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  padding-top: 4px;
}
.wk-dot {
  width: 28px;
  height: 28px;
  min-height: 28px;
  padding: 0;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--mut);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.wk-dot.att {
  background: var(--teal);
  color: var(--onteal);
  border-color: var(--teal);
}
.wk-dot.cur {
  outline: 2px solid var(--amber);
  outline-offset: 1px;
}
.wk-dot.exam {
  background: var(--note);
  color: var(--amber);
  border-color: var(--amber);
  cursor: default;
}
.wk-dot.locked {
  opacity: 0.45;
  cursor: not-allowed;
  background: var(--bg);
}

.cal-wrap {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow-x: auto;
}
.cal-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  text-align: left;
}
.cal-table th {
  background: var(--teal);
  color: var(--onteal);
  padding: 12px 14px;
  font-weight: 700;
  white-space: nowrap;
}
.cal-table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.cal-table tr:last-child td { border-bottom: none; }
.cal-table tr.cur-week { background: var(--note); font-weight: 600; }

.matrix-cell {
  text-align: center;
  cursor: pointer;
  user-select: none;
  font-weight: 700;
  border-radius: 6px;
  padding: 6px 4px;
}
.matrix-cell.yes { color: var(--teal); background: var(--lec); }
.matrix-cell.no { color: var(--mut); opacity: 0.55; }
.matrix-cell.exam { color: var(--amber); background: var(--note); cursor: default; font-size: 11px; }
.matrix-cell.locked { color: var(--mut); opacity: 0.45; cursor: not-allowed; font-size: 11px; }

.ver {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  padding: 5px 12px;
  border-radius: 999px;
  background: var(--lec);
  color: var(--onlec);
  font-size: 13px;
  font-weight: 600;
}

.x-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  color: #1D9BF0;
  flex-shrink: 0;
}

.user-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.2;
}

.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 100;
}
.modal-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 24px;
  max-width: 480px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-height: 90vh;
  overflow-y: auto;
}
</style>
</head>
<body>

<div class="gate" id="login">
  <div class="gc">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <h1>My Timetable</h1>
        <p>BIS Academic Portal · 2026–2027</p>
      </div>
      <button type="button" class="gh2 x" id="themeBtnGate" title="Toggle Theme">🌓</button>
    </div>

    <div class="auth-tabs">
      <button type="button" class="on" id="tabLogin">Sign In</button>
      <button type="button" id="tabReg">Create Account</button>
    </div>

    <div id="authMsg" class="err-box" hidden></div>

    <form id="authForm" style="display:flex; flex-direction:column; gap:12px;">
      <div class="field" id="fullNameField" hidden>
        <label for="uFullName">Full Name</label>
        <input id="uFullName" type="text" autocomplete="name" placeholder="e.g. Hesham Mohamed">
      </div>
      <div class="field">
        <label for="uUser">Username</label>
        <input id="uUser" type="text" required autocomplete="username" placeholder="Enter your username">
      </div>
      <div class="field">
        <label for="uPass">Password</label>
        <input id="uPass" type="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="on" id="authSubmit" style="margin-top:4px;">Sign In</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <span class="clock-pill" id="liveClock">🕒 --:--:--</span>
    <span class="sync-pill" id="syncStatus">☁️ Synced</span>
    <span id="who" class="user-pill"></span>
    <button type="button" class="x" id="topAdminBtn" data-act="openAdminTop" hidden>🛡️ Admin Panel</button>
    <button type="button" class="gh2 x" id="themeBtn" title="Toggle Theme">🌓</button>
    <button type="button" class="gh2 x" data-act="out">Sign Out</button>
  </header>

  <div class="w">
    <div>
      <h1>My Academic Timetable</h1>
      <p>Faculty of Commerce & Business Administration · BIS (First Semester 2026–2027)</p>
    </div>

    <div class="week-bar" id="weekBanner"></div>
    <div class="stats" id="stats"></div>
    <div class="special-tools" id="specialTools"></div>
    <div class="tabs" id="tabs"></div>
    <div id="days" style="display:flex; flex-direction:column; gap:20px"></div>
  </div>
</div>

<div class="modal-bg" id="addModal" hidden>
  <div class="modal-card">
    <div class="row" style="justify-content:space-between;">
      <h3>Add New Lecture or Section</h3>
      <button type="button" class="gh2 x" id="closeModal">✕</button>
    </div>
    <div class="field">
      <label>Day</label>
      <select id="ncDay">
        <option value="Saturday">Saturday</option>
        <option value="Sunday">Sunday</option>
        <option value="Monday" selected>Monday</option>
        <option value="Tuesday">Tuesday</option>
        <option value="Wednesday">Wednesday</option>
        <option value="Thursday">Thursday</option>
      </select>
    </div>
    <div class="field">
      <label>Type</label>
      <select id="ncType">
        <option value="Lecture">Lecture</option>
        <option value="Section">Section</option>
      </select>
    </div>
    <div class="field">
      <label>Course Name</label>
      <input id="ncName" type="text" placeholder="e.g. Programming 1 Section">
    </div>
    <div class="field">
      <label>Instructor / Doctor</label>
      <input id="ncDoc" type="text" placeholder="e.g. Dr. Heba Mohsen / TA">
    </div>
    <div class="row">
      <div class="field" style="flex:1;">
        <label>Time</label>
        <input id="ncTime" type="text" placeholder="10:00 - 12:00">
      </div>
      <div class="field" style="flex:1;">
        <label>Room & Group</label>
        <input id="ncRoom" type="text" placeholder="BIS 11 · Group 3">
      </div>
    </div>
    <button type="button" class="on" id="saveNewClass">Save to Timetable</button>
  </div>
</div>

<script>

const todayISO = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};

function detectCurrentWeek() {
  const t = todayISO();
  const found = STUDY_WEEKS.find(x => t >= x.s && t < x.e);
  if (found) return found.w;
  if (t >= STUDY_WEEKS[STUDY_WEEKS.length - 1].e) return "Finals";
  return "1";
}

function isFutureWeek(wkStr) {
  const wk = STUDY_WEEKS.find(x => x.w === String(wkStr));
  if (!wk) return false;
  return todayISO() < wk.s;
}

async function hashPassword(str) {
  try {
    const msgBuffer = new TextEncoder().encode(str);
    const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    return btoa(unescape(encodeURIComponent(str)));
  }
}

function getSchedule() {
  const baseDays = isHeshamAccount()
    ? HESHAM_DEFAULT_DAYS.map(d => ({ d: d.d, k: d.k, c: [...d.c] }))
    : [];

  customClasses.forEach(item => {
    let dayObj = baseDays.find(x => x.d === item.day);
    if (!dayObj) {
      const meta = ALL_WEEK_DAYS.find(x => x.d === item.day) || { d: item.day, k: "mon" };
      dayObj = { d: meta.d, k: meta.k, c: [] };
      baseDays.push(dayObj);
    }
    dayObj.c.push({
      id: item.id,
      t: item.time,
      n: item.name,
      ty: item.type,
      doc: item.doc,
      r: item.room,
      g: "",
      custom: true
    });
  });

  const order = ALL_WEEK_DAYS.map(x => x.d);
  baseDays.sort((a, b) => order.indexOf(a.d) - order.indexOf(b.d));
  return baseDays;
}

async function fetchAllAccountsForAdmin() {
  if (!isAdminUser()) return;
  adminLoading = true;
  render();

  if (supabaseClient) {
    try {
      const { data, error } = await supabaseClient
        .from("user_timetables")
        .select("username, payload, updated_at")
        .order("updated_at", { ascending: false });
      if (error) throw error;
      adminUsersList = data || [];
    } catch (e) {
      adminToastMsg = "Could not load accounts from Supabase: " + (e.message || "Error");
      adminToastErr = true;
      adminUsersList = [];
    }
  } else {
    const localU = getLocalUsers();
    adminUsersList = Object.keys(localU).map(u => ({
      username: u,
      payload: localU[u],
      updated_at: null
    }));
  }

  adminLoading = false;
  render();
}

async function toggleUserVerification(targetUsername, newStatus) {
  if (!isAdminUser()) return;
  try {
    if (supabaseClient) {
      const { data, error: fetchErr } = await supabaseClient
        .from("user_timetables")
        .select("payload")
        .ilike("username", targetUsername)
        .maybeSingle();
      if (fetchErr) throw fetchErr;
      const updatedPayload = { ...(data?.payload || {}), verified: newStatus };
      const { error: updErr } = await supabaseClient
        .from("user_timetables")
        .update({ payload: updatedPayload })
        .ilike("username", targetUsername);
      if (updErr) throw updErr;
    } else {
      const localU = getLocalUsers();
      const key = targetUsername.toLowerCase();
      if (localU[key]) {
        localU[key].verified = newStatus;
        saveLocalUsers(localU);
      }
    }
    adminToastMsg = newStatus
      ? `Granted verification badge to @${targetUsername}.`
      : `Removed verification badge from @${targetUsername}.`;
    adminToastErr = false;
    await fetchAllAccountsForAdmin();
  } catch (e) {
    adminToastMsg = "Failed to update verification badge: " + (e.message || "Database error");
    adminToastErr = true;
    render();
  }
}

async function saveAdminUserEdit(oldUsername, idx) {
  if (!isAdminUser()) return;
  const newFullInput = $("adm-fn-" + idx);
  const newUserInput = $("adm-u-" + idx);
  const newPassInput = $("adm-p-" + idx);
  if (!newUserInput || !newPassInput) return;

  const newFullName = newFullInput ? newFullInput.value.trim() : "";
  const rawNewUsername = newUserInput.value.trim();
  const newUsernameKey = rawNewUsername.toLowerCase();
  const newPassword = newPassInput.value;

  if (!rawNewUsername) {
    adminToastMsg = "Username cannot be empty.";
    adminToastErr = true;
    render();
    return;
  }

  try {
    const targetRow = adminUsersList.find(u => u.username.toLowerCase() === oldUsername.toLowerCase());
    const updatedPayload = {
      ...(targetRow?.payload || {}),
      displayName: rawNewUsername,
      fullName: newFullName
    };
    const updateFields = { updated_at: new Date().toISOString() };

    if (newPassword) {
      updatedPayload.plainPassword = newPassword;
      updateFields.password_hash = await hashPassword(newPassword);
    }
    updateFields.payload = updatedPayload;
    if (newUsernameKey !== oldUsername.toLowerCase()) {
      updateFields.username = newUsernameKey;
    }

    if (supabaseClient) {
      const { error } = await supabaseClient
        .from("user_timetables")
        .update(updateFields)
        .ilike("username", oldUsername);
      if (error) throw error;
    } else {
      const localU = getLocalUsers();
      const existing = localU[oldUsername.toLowerCase()] || {};
      delete localU[oldUsername.toLowerCase()];
      localU[newUsernameKey] = {
        ...existing,
        displayName: rawNewUsername,
        fullName: newFullName,
        ...(newPassword ? { plainPassword: newPassword, passHash: updateFields.password_hash } : {})
      };
      saveLocalUsers(localU);
    }

    if (oldUsername.toLowerCase() === currentUser.username.trim().toLowerCase()) {
      currentUser.username = rawNewUsername;
      currentUser.dbUsername = newUsernameKey;
      currentUser.fullName = newFullName;
      if (newPassword) currentUser.plainPassword = newPassword;
      touchSessionActivity();
      updateUserHeaderBadge();
    }

    adminToastMsg = `Saved updates for @${rawNewUsername}.`;
    adminToastErr = false;
    await fetchAllAccountsForAdmin();
  } catch (e) {
    adminToastMsg = "Failed to save changes: " + (e.message || "Username may already exist");
    adminToastErr = true;
    render();
  }
}

async function deleteAdminUser(targetUsername) {
  if (!isAdminUser()) return;
  if (targetUsername.toLowerCase() === "hesham") {
    adminToastMsg = "The primary admin account cannot be deleted.";
    adminToastErr = true;
    adminConfirmDel = null;
    render();
    return;
  }

  try {
    if (supabaseClient) {
      const { error } = await supabaseClient
        .from("user_timetables")
        .delete()
        .ilike("username", targetUsername);
      if (error) throw error;
    } else {
      const localU = getLocalUsers();
      delete localU[targetUsername.toLowerCase()];
      saveLocalUsers(localU);
    }

    adminConfirmDel = null;
    adminToastMsg = `Deleted account @${targetUsername}.`;
    adminToastErr = false;
    await fetchAllAccountsForAdmin();
  } catch (e) {
    adminToastMsg = "Failed to delete user: " + (e.message || "Database error");
    adminToastErr = true;
    adminConfirmDel = null;
    render();
  }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  const id = b.dataset.id;
  const s = id ? getClassState(id) : null;

  if (act === "out") {
    if (syncTimer) {
      clearTimeout(syncTimer);
      pushToCloud();
    }
    localStorage.removeItem(SESSION_KEY);
    currentUser = null;
    isUserVerified = false;
    S = {};
    customClasses = [];
    $("app").hidden = true;
    $("login").hidden = false;
    return;
  }

  if (act === "openAdminTop") {
    if (!isAdminUser()) return;
    tab = tab === "Admin" ? "All" : "Admin";
    adminToastMsg = "";
    adminConfirmDel = null;
    rs = false;
    if (tab === "Admin") {
      fetchAllAccountsForAdmin();
      return;
    }
    render();
    return;
  }

  if (act === "toggleSpecial") {
    const targetTab = b.dataset.t;
    tab = tab === targetTab ? "All" : targetTab;
    rs = false;
    render();
    return;
  }

  if (act === "tab") {
    tab = b.dataset.t;
    rs = false;
    render();
    return;
  }

  if (act === "refreshAdmin") {
    adminToastMsg = "";
    adminConfirmDel = null;
    fetchAllAccountsForAdmin();
    return;
  }

  if (act === "verifyUser") {
    adminConfirmDel = null;
    toggleUserVerification(b.dataset.u, b.dataset.v === "1");
    return;
  }

  if (act === "saveUserEdit") {
    adminConfirmDel = null;
    saveAdminUserEdit(b.dataset.u, Number(b.dataset.idx));
    return;
  }

  if (act === "deleteUser") {
    const targetU = b.dataset.u;
    if (!adminConfirmDel || adminConfirmDel.toLowerCase() !== targetU.toLowerCase()) {
      adminConfirmDel = targetU;
      render();
      return;
    }
    deleteAdminUser(targetU);
    return;
  }

  if (act === "jumpCurrentWeek") {
    selectedWeek = autoDetectedWeek;
    render();
    return;
  }

  if (act === "openAdd") {
    $("addModal").hidden = false;
    return;
  }

  if (act === "reset") {
    if (!rs) { rs = true; render(); return; }
    S = {};
    customClasses = [];
    rs = false;
    saveAll();
  } else if (act === "nw") {
    if (isFutureWeek(selectedWeek)) return;
    allClasses().forEach(c => {
      const st = getClassState(c.id);
      delete st.attWeeks[selectedWeek];
    });
    saveAll();
  } else if (act === "att") {
    const cls = allClasses().find(x => x.id === id);
    const isPreSec = cls && cls.ty === "Section" && (selectedWeek === "1" || selectedWeek === "2");
    if (selectedWeek === "8" || selectedWeek === "Finals" || isPreSec || isFutureWeek(selectedWeek)) return;
    if (s.attWeeks[selectedWeek]) {
      delete s.attWeeks[selectedWeek];
    } else {
      s.attWeeks[selectedWeek] = new Date().toISOString();
    }
    saveAll();
  } else if (act === "attWk") {
    const wk = b.dataset.w;
    const cls = allClasses().find(x => x.id === id);
    const isPreSec = cls && cls.ty === "Section" && (wk === "1" || wk === "2");
    if (wk === "8" || wk === "Finals" || isPreSec || isFutureWeek(wk)) return;
    if (s.attWeeks[wk]) {
      delete s.attWeeks[wk];
    } else {
      s.attWeeks[wk] = new Date().toISOString();
    }
    saveAll();
  } else if (act === "tog") {
    s.asg[b.dataset.i].done = !s.asg[b.dataset.i].done;
    saveAll();
  } else if (act === "del") {
    s.asg.splice(b.dataset.i, 1);
    saveAll();
  } else if (act === "add") {
    const inp = $("at-" + id);
    const t = inp.value.trim();
    if (!t) return;
    s.asg.push({ t, due: $("ad-" + id).value, done: false });
    saveAll();
  } else if (act === "delClass") {
    customClasses = customClasses.filter(x => x.id !== id);
    delete S[id];
    saveAll();
  }

  if (act !== "reset") rs = false;
  render();
});

$("authForm").onsubmit = async e => {
  e.preventDefault();
  hideAuthMessage();
  const rawUsername = $("uUser").value.trim();
  const usernameKey = rawUsername.toLowerCase();
  const fullNameInput = $("uFullName") ? $("uFullName").value.trim() : "";
  const password = $("uPass").value;
  if (!rawUsername || !password) return;

  $("authSubmit").disabled = true;
  $("authSubmit").textContent = "Please wait…";

  try {
    const passHash = await hashPassword(password);

    if (supabaseClient) {
      if (authMode === "register") {
        const { data: existing } = await supabaseClient
          .from("user_timetables")
          .select("username")
          .ilike("username", usernameKey)
          .maybeSingle();

        if (existing) {
          showAuthMessage("This username is already taken. Please choose another one.");
        } else {
          const initialPayload = {
            displayName: rawUsername,
            fullName: fullNameInput,
            plainPassword: password,
            verified: usernameKey === "hesham",
            state: {},
            customClasses: []
          };
          const { error: insErr } = await supabaseClient
            .from("user_timetables")
            .insert({ username: usernameKey, password_hash: passHash, payload: initialPayload });
          if (insErr) throw insErr;
          await enterApp({ username: rawUsername, dbUsername: usernameKey, fullName: fullNameInput, plainPassword: password }, initialPayload);
        }
      } else {
        const { data: row, error: selErr } = await supabaseClient
          .from("user_timetables")
          .select("username, password_hash, payload")
          .ilike("username", usernameKey)
          .maybeSingle();

        if (selErr) throw selErr;
        if (!row) {
          showAuthMessage("Account not found. Switch to 'Create Account' to register.");
        } else if (row.password_hash !== passHash) {
          showAuthMessage("Incorrect password. Please try again.");
        } else {
          const updatedPayload = {
            ...(row.payload || {}),
            displayName: rawUsername,
            plainPassword: password
          };
          supabaseClient
            .from("user_timetables")
            .update({ payload: updatedPayload })
            .ilike("username", row.username)
            .then(() => {});
          await enterApp({
            username: rawUsername,
            dbUsername: row.username,
            fullName: row.payload?.fullName || "",
            plainPassword: password
          }, updatedPayload);
        }
      }
    } else {
      const users = getLocalUsers();
      if (authMode === "register") {
        if (users[usernameKey]) {
          showAuthMessage("This username already exists on this device.");
        } else {
          users[usernameKey] = {
            displayName: rawUsername,
            fullName: fullNameInput,
            plainPassword: password,
            passHash,
            verified: usernameKey === "hesham",
            state: {},
            customClasses: []
          };
          saveLocalUsers(users);
          await enterApp({ username: rawUsername, dbUsername: usernameKey, fullName: fullNameInput, plainPassword: password });
        }
      } else {
        if (!users[usernameKey]) {
          showAuthMessage("Account not found. Switch to 'Create Account' to register.");
        } else if (users[usernameKey].passHash !== passHash) {
          showAuthMessage("Incorrect password.");
        } else {
          users[usernameKey].displayName = rawUsername;
          users[usernameKey].plainPassword = password;
          saveLocalUsers(users);
          await enterApp({
            username: rawUsername,
            dbUsername: usernameKey,
            fullName: users[usernameKey].fullName || "",
            plainPassword: password
          });
        }
      }
    }
  } catch (err) {
    showAuthMessage("Connection error: " + (err.message || "Please check your internet connection."));
  } finally {
    $("authSubmit").disabled = false;
    $("authSubmit").textContent = authMode === "login" ? "Sign In" : "Create Account & Enter";
  }
};

function toggleTheme() {
  const root = document.documentElement;
  const isDark = root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const next = isDark ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("bis_theme", next); } catch (e) {}
}

$("themeBtn").onclick = toggleTheme;
$("themeBtnGate").onclick = toggleTheme;

(function boot() {
  try {
    const savedTheme = localStorage.getItem("bis_theme");
    if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

    const rawSess = localStorage.getItem(SESSION_KEY);
    if (rawSess) {
      const sess = JSON.parse(rawSess);
      const elapsed = Date.now() - (sess.lastActive || 0);
      if (sess && sess.username && elapsed <= SESSION_TTL_MS) {
        enterApp(sess);
        if (supabaseClient) {
          const dbKey = (sess.dbUsername || sess.username).toLowerCase();
          supabaseClient
            .from("user_timetables")
            .select("username, payload")
            .ilike("username", dbKey)
            .maybeSingle()
            .then(({ data }) => {
              if (data && data.payload) {
                currentUser.dbUsername = data.username;
                S = data.payload.state || {};
                customClasses = data.payload.customClasses || [];
                if (data.payload.fullName) currentUser.fullName = data.payload.fullName;
                isUserVerified = !!data.payload.verified || isAdminUser();
                saveLocalData();
                touchSessionActivity();
                render();
              }
            });
        }
      } else {
        localStorage.removeItem(SESSION_KEY);
      }
    }
  } catch (e) {}
})();
</script>
</body>
